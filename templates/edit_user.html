<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Edit User</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f9;
        }

        header {
            background: #1f4e78;
            color: white;
            padding: 20px 30px;
        }

        header h1 {
            margin: 0;
        }

        .container {
            max-width: 700px;
            margin: 40px auto;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        h2 {
            color: #1f4e78;
            margin-top: 0;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 7px;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 15px;
        }

        button {
            background: #1f4e78;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            opacity: 0.85;
        }

        .back {
            display: inline-block;
            margin-bottom: 20px;
            background: #6c757d;
            color: white;
            text-decoration: none;
            padding: 10px 15px;
            border-radius: 5px;
        }

        .info {
            background: #cff4fc;
            color: #055160;
            padding: 12px;
            border-radius: 5px;
            margin-bottom: 20px;
        }

    </style>

</head>

<body>

<header>

    <h1>
        👤 Edit User
    </h1>

</header>

<div class="container">

    <a
        href="/users"
        class="back"
    >
        ← Back to Users
    </a>

    <div class="card">

        <h2>
            Edit {{ user["username"] }}
        </h2>

        <div class="info">
            Leave the password blank if you do not want to change it.
        </div>

        <form
            method="POST"
        >

            <div class="form-group">

                <label>
                    Username
                </label>

                <input
                    type="text"
                    name="username"
                    value="{{ user['username'] }}"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    New Password
                </label>

                <input
                    type="password"
                    name="password"
                    placeholder="Leave blank to keep current password"
                >

            </div>


            <div class="form-group">

                <label>
                    Role
                </label>

                <select
                    name="role"
                    required
                >

                    <option
                        value="staff"
                        {% if user["role"] == "staff" %}
                        selected
                        {% endif %}
                    >
                        Staff
                    </option>

                    <option
                        value="admin"
                        {% if user["role"] == "admin" %}
                        selected
                        {% endif %}
                    >
                        Administrator
                    </option>

                </select>

            </div>


            <button
                type="submit"
            >
                Save Changes
            </button>

        </form>

    </div>

</div>

</body>

</html>
